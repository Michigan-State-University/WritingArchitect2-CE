name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: changeme
          MYSQL_DATABASE: wa2
          MYSQL_USER: waAdmin1
          MYSQL_PASSWORD: changeme
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pchangeme"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql

      - name: Initialize fresh database
        run: mysql --protocol=TCP -h 127.0.0.1 -uroot -pchangeme wa2 < init_db/001_initial.sql

      - name: Run regression tests
        env:
          WA_TEST_DB_DSN: mysql:host=127.0.0.1;dbname=wa2;charset=utf8mb4
          WA_TEST_DB_USERNAME: waAdmin1
          WA_TEST_DB_PASSWORD: changeme
        run: |
          php tests/student_batch_import_test.php
          php tests/account_identity_regression_test.php
          php tests/student_account_integration_test.php
          php tests/ciws_score_calculator_test.php
          php tests/ciws_score_submission_test.php
          php tests/ciws_scoring_markup_parser_test.php
          node tests/ciws_score_calculator.test.js
          node tests/ciws_scoring_interface.test.js
